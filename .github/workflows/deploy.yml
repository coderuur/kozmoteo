name: Deploy Next.js to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'arayuz/package-lock.json'

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci
        working-directory: arayuz

      - name: Build Next.js
        run: npm run build
        working-directory: arayuz
        env:
          GITHUB_ACTIONS: true
          NEXT_PUBLIC_BASE_PATH: /kozmoteo

      - name: Ensure .nojekyll exists
        run: touch arayuz/out/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: arayuz/out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
